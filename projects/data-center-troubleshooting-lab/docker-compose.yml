services:
  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./lab/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./lab/site:/usr/share/nginx/html:ro
    restart: unless-stopped

  probe:
    image: python:3.12-alpine
    profiles:
      - tools
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    entrypoint:
      - python
      - tools/diagnose.py
